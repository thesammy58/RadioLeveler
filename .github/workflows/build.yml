name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The compiler every tested build was made with; build.sh's output is byte-identical with it.
  LLVM_MINGW_NAME: llvm-mingw-20260922-msvcrt-ubuntu-22.04-x86_64
  LLVM_MINGW_SHA256: 17bbc667b96f7b1f02ce4a172d8cac4fa480927a1f649e788dee5914919566a1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw
        run: |
          curl -sSLo llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/$LLVM_MINGW_NAME.tar.xz"
          echo "$LLVM_MINGW_SHA256  llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf llvm-mingw.tar.xz -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$RUNNER_TEMP/$LLVM_MINGW_NAME" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Test
        run: |
          cc -O2 -o obj/ab_test tests/ab_test.c -lm && obj/ab_test
          cc -O2 -o obj/bench tests/bench.c -lm && obj/bench
          cp package/RadioLeveler.package obj/committed.package
          python3 tools/make_package.py obj/check.package && cmp obj/check.package obj/committed.package

      - name: Package
        run: python3 tools/make_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: RadioLeveler
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            Built from this tag by GitHub Actions with llvm-mingw 20260922 (see `build.sh`).
            Unzip and copy the `Game` and `Mods` folders' contents to where the README's Install section says. `RadioLeveler.pdb` holds the debug symbols and is optional.
            SHA-256 hashes of the `.asi` and `.pdb` are in `SHA256SUMS.txt`, attached here and in the build log.
