name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release | x86 with Visual Studio
        run: msbuild RadioLeveler.slnx -p:Configuration=Release -p:Platform=x86 -m

      - name: Test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/sync_ini.py
          python tools/make_package.py Release\check.package
          fc.exe /b Release\check.package package\RadioLeveler.package
          msbuild tests\abi_test.vcxproj -p:Configuration=Release -p:Platform=Win32 -m
          Release\tests\TS3.exe Release\RadioLeveler.asi

      - name: Package
        run: python tools/make_release.py Release\RadioLeveler.asi

      - uses: actions/upload-artifact@v4
        with:
          name: RadioLeveler
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            **To install:** download the zip below. Copy the files in its `Game\Bin` folder (`RadioLeveler.asi` and `RadioLeveler.ini`) into `The Sims 3\Game\Bin`, and `Mods\Packages\RadioLeveler.package` into `Documents\Electronic Arts\The Sims 3\Mods\Packages`. You need an ASI loader; see the [README](https://github.com/${{ github.repository }}#install). If you're upgrading and have changed your `RadioLeveler.ini`, keep your copy.

            Built from this tag by GitHub Actions with Visual Studio (Release | x86). This mod was made with AI (Claude); the README explains who did what.
