; RadioLeveler settings. Changes are picked up while the game runs (within ~2 s).
; Every value below is the shipped default; delete a line to go back to it.
[RadioLeveler]
; 1 = level radio songs, 0 = pass audio through untouched
Enabled=1

; How hard songs are pulled to the same loudness:
;   standard - tightest; also evens out loud and quiet sections within a song
;   relaxed  - songs still close, more of each song's own loud/quiet shape kept
;   light    - mostly fixes song-to-song jumps, leaves songs alone otherwise
;   subtle   - lightest touch
Strength=standard

; Loudness every song is steered to, before the stereo's own volume setting.
; Raise it (e.g. -14) for louder radio overall, lower it (e.g. -18) for quieter.
TargetLUFS=-16

; Most a quiet song is turned up / a loud song is turned down, in dB
MaxBoostDB=10
MaxCutDB=12

; Peak ceiling of the built-in limiter (dBFS, before the stereo volume). 0 disables it.
LimiterCeilingDB=-1

; A/B hotkey: switches leveling off/on instantly while the game has focus, so you can compare.
; Ctrl/Shift/Alt + a letter, digit, F1-F24, Insert, Home, End, PageUp, PageDown, Delete,
; Pause or ScrollLock. Use None to disable.
ToggleHotkey=Ctrl+Shift+L

; 1 = write RadioLeveler.log next to the .asi, 0 = don't write a log at all
Logging=1
; Log a line when a song starts/ends (1 = on, 0 = off)
LogSongs=1
; Also log a status line per playing radio every N seconds (0 = off)
LogIntervalSec=30

; Advanced: override single values of the Strength preset (values shown are 'standard')
;PriorUpSec=1.5
;PriorDownSec=0.5
;UpDbPerSec=6
;DownDbPerSec=24
;ForgetSec=8
;GateLUFS=-50
;RelGateDB=20
;SilenceLUFS=-45
;SilenceMs=250
;JumpDB=6
;JumpSec=4
;LookaheadMs=3
;ReleaseMs=120
